<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1" />
<title>Resistor Lab — Series & Parallel</title>
<style>
:root{--bg:#eef3f8;--panel:#fff;--ink:#18212b;--muted:#647383;--line:#cbd5df;--accent:#1769aa;--wire:#334155;--good:#16794b;--warm:#b45309}
*{box-sizing:border-box} body{margin:0;font-family:system-ui,-apple-system,Segoe UI,Roboto,Arial,sans-serif;background:var(--bg);color:var(--ink)}
header{background:#17324d;color:white;padding:18px 24px} header h1{margin:0;font-size:1.6rem} header p{margin:.35rem 0 0;color:#dbe8f4}
main{max-width:1200px;margin:auto;padding:18px}.controls,.card{background:var(--panel);border:1px solid var(--line);border-radius:14px;box-shadow:0 2px 8px #0001}.controls{padding:15px;display:flex;flex-wrap:wrap;gap:14px;align-items:end;margin-bottom:16px}.control{display:flex;flex-direction:column;gap:5px}.control label{font-weight:700;font-size:.88rem}.control input,.control select{font:inherit;padding:8px 10px;border:1px solid #aebbc7;border-radius:8px;background:#fff}.resinputs{display:flex;gap:10px;flex-wrap:wrap}.tabs{display:flex;gap:8px;margin-bottom:14px}.tabs button{border:1px solid #aebbc7;background:#fff;padding:9px 18px;border-radius:999px;font-weight:700;cursor:pointer}.tabs button.active{background:var(--accent);color:#fff;border-color:var(--accent)}
.grid{display:grid;grid-template-columns:1.15fr .85fr;gap:16px}.card{padding:16px}.card h2{margin:0 0 10px;font-size:1.2rem}.diagram{width:100%;height:330px;background:#fbfdff;border:1px solid #d8e1e9;border-radius:12px}.formula{font-family:Georgia,serif;font-size:1.12rem;background:#f4f7fa;padding:10px 12px;border-left:4px solid var(--accent);margin:10px 0;border-radius:5px}.big{font-size:1.25rem;font-weight:800;color:var(--accent)}table{width:100%;border-collapse:collapse;margin-top:8px}th,td{padding:9px;border-bottom:1px solid #e1e7ed;text-align:right}th:first-child,td:first-child{text-align:left}th{background:#f6f8fa}.note{color:var(--muted);font-size:.92rem}.concept{margin-top:12px;padding:12px;border-radius:10px;background:#f7fafc}.same{color:var(--good);font-weight:800}.different{color:var(--warm);font-weight:800}.legend{font-size:.83rem;fill:#526170}.hide{display:none}@media(max-width:800px){.grid{grid-template-columns:1fr}.diagram{height:280px}}
</style>
</head>
<body>
<header><h1>Resistor Lab: Series & Parallel</h1><p>Change the source voltage, number of resistors, and resistance values to see Ohm's Law update instantly.</p></header>
<main>
<section class="controls">
 <div class="control"><label for="voltage">Source Voltage (V)</label><input id="voltage" type="number" min="0" step="0.1" value="12"></div>
 <div class="control"><label for="count">Number of Resistors</label><select id="count"><option>1</option><option selected>2</option><option>3</option></select></div>
 <div class="resinputs">
  <div class="control" id="r1box"><label>R1 (Ω)</label><input id="r1" type="number" min="0.1" step="100" value="1000"></div>
  <div class="control" id="r2box"><label>R2 (Ω)</label><input id="r2" type="number" min="0.1" step="100" value="1000"></div>
  <div class="control" id="r3box"><label>R3 (Ω)</label><input id="r3" type="number" min="0.1" step="100" value="1000"></div>
 </div>
</section>
<div class="tabs"><button id="seriesBtn" class="active">Series</button><button id="parallelBtn">Parallel</button></div>
<div class="grid">
<section class="card"><h2 id="diagramTitle">Series Circuit</h2><svg id="diagram" class="diagram" viewBox="0 0 650 330" aria-label="circuit diagram"></svg><div id="concept" class="concept"></div></section>
<section class="card"><h2>Calculations</h2><div id="summary"></div><table><thead><tr><th>Resistor</th><th>R</th><th>V</th><th>I</th></tr></thead><tbody id="rows"></tbody></table><p class="note">Values are idealized DC calculations. Current is shown in mA when convenient.</p></section>
</div>
</main>
<script>
const $=id=>document.getElementById(id); let mode='series';
const els=['voltage','count','r1','r2','r3']; els.forEach(id=>$(id).addEventListener('input',update));
$('seriesBtn').onclick=()=>{mode='series';setTabs();update()}; $('parallelBtn').onclick=()=>{mode='parallel';setTabs();update()};
function setTabs(){$('seriesBtn').classList.toggle('active',mode==='series');$('parallelBtn').classList.toggle('active',mode==='parallel')}
function fmtR(x){if(x>=1e6)return (x/1e6).toFixed(3).replace(/\.?0+$/,'')+' MΩ';if(x>=1000)return (x/1000).toFixed(3).replace(/\.?0+$/,'')+' kΩ';return x.toFixed(2).replace(/\.?0+$/,'')+' Ω'}
function fmtV(x){return x.toFixed(3).replace(/\.?0+$/,'')+' V'}
function fmtI(a){if(Math.abs(a)<1)return (a*1000).toFixed(3).replace(/\.?0+$/,'')+' mA';return a.toFixed(3).replace(/\.?0+$/,'')+' A'}
function resistor(x,y,w=85){return `<line x1="${x-28}" y1="${y}" x2="${x}" y2="${y}" stroke="#334155" stroke-width="4"/><rect x="${x}" y="${y-15}" width="${w}" height="30" rx="4" fill="#ead9a7" stroke="#765f30" stroke-width="2"/><line x1="${x+w}" y1="${y}" x2="${x+w+28}" y2="${y}" stroke="#334155" stroke-width="4"/>`}
function update(){
 let n=+$('count').value,V=Math.max(0,+$('voltage').value||0), R=[+$('r1').value||.1,+$('r2').value||.1,+$('r3').value||.1].slice(0,n).map(x=>Math.max(.1,x));
 $('r2box').classList.toggle('hide',n<2);$('r3box').classList.toggle('hide',n<3);
 let rt, vals=[];
 if(mode==='series'){rt=R.reduce((a,b)=>a+b,0);let I=V/rt;vals=R.map(r=>({r,v:I*r,i:I}));
  $('summary').innerHTML=`<div class="formula">R<sub>T</sub> = ${R.map((r,i)=>`R${i+1}`).join(' + ')} = ${R.map(fmtR).join(' + ')} = <span class="big">${fmtR(rt)}</span></div><div class="formula">Ohm's Law: I<sub>T</sub> = V<sub>T</sub> / R<sub>T</sub> = ${fmtV(V)} / ${fmtR(rt)} = <span class="big">${fmtI(I)}</span></div><div class="formula">V<sub>n</sub> = I × R<sub>n</sub></div>`;
  $('concept').innerHTML=`In a <b>series</b> circuit, current is <span class="same">the same through every resistor</span>. Each resistor can have a <span class="different">different voltage drop</span>. The voltage drops add to the source voltage: <b>${vals.map(x=>fmtV(x.v)).join(' + ')} = ${fmtV(V)}</b>.`;
  drawSeries(R,vals,V,rt,I);
 } else {rt=1/R.reduce((s,r)=>s+1/r,0);vals=R.map(r=>({r,v:V,i:V/r}));let It=vals.reduce((s,x)=>s+x.i,0);
  $('summary').innerHTML=`<div class="formula">1/R<sub>T</sub> = ${R.map((r,i)=>`1/R${i+1}`).join(' + ')}</div><div class="formula">1/R<sub>T</sub> = ${R.map(r=>`1/${fmtR(r)}`).join(' + ')} &nbsp; → &nbsp; R<sub>T</sub> = <span class="big">${fmtR(rt)}</span></div><div class="formula">I<sub>n</sub> = V / R<sub>n</sub> &nbsp;&nbsp; and &nbsp;&nbsp; I<sub>T</sub> = ${vals.map((x,i)=>`I${i+1}`).join(' + ')} = <span class="big">${fmtI(It)}</span></div>`;
  $('concept').innerHTML=`In a <b>parallel</b> circuit, voltage is <span class="same">the same across every branch</span>. Branches can have <span class="different">different currents</span> depending on resistance. Total current is the sum of branch currents.`;
  drawParallel(R,vals,V,rt,It);
 }
 $('rows').innerHTML=vals.map((x,i)=>`<tr><td>R${i+1}</td><td>${fmtR(x.r)}</td><td>${fmtV(x.v)}</td><td>${fmtI(x.i)}</td></tr>`).join('')+`<tr><th>Total</th><th>${fmtR(rt)}</th><th>${fmtV(V)}</th><th>${fmtI(mode==='series'?vals[0].i:vals.reduce((s,x)=>s+x.i,0))}</th></tr>`;
}
function battery(){return `<line x1="65" y1="130" x2="65" y2="200" stroke="#334155" stroke-width="4"/><line x1="50" y1="150" x2="80" y2="150" stroke="#111" stroke-width="5"/><line x1="56" y1="178" x2="74" y2="178" stroke="#111" stroke-width="3"/><text x="31" y="144" class="legend">+</text><text x="32" y="187" class="legend">−</text>`}
function drawSeries(R,vals,V,rt,I){$('diagramTitle').textContent='Series Circuit';let n=R.length,start=150,gap=n===1?0:n===2?180:135;let parts=`${battery()}<path d="M65 130 V75 H590 V245 H65 V200" fill="none" stroke="#334155" stroke-width="4"/>`;
 R.forEach((r,i)=>{let x=start+i*gap;parts+=resistor(x,75,75)+`<text x="${x+37}" y="47" text-anchor="middle" font-weight="700">R${i+1} = ${fmtR(r)}</text><text x="${x+37}" y="116" text-anchor="middle" class="legend">ΔV${i+1} = ${fmtV(vals[i].v)}</text>`});parts+=`<text x="330" y="285" text-anchor="middle" font-size="16">Same current everywhere: ${fmtI(I)}</text><text x="100" y="173" class="legend">${fmtV(V)}</text>`;$('diagram').innerHTML=parts}
function drawParallel(R,vals,V,rt,It){
 $('diagramTitle').textContent='Parallel Circuit';
 // Textbook-style parallel circuit: continuous top/bottom buses, battery at far left,
 // and each resistor as its own vertical branch between the same two nodes.
 let xs=R.length===1?[330]:R.length===2?[270,440]:[225,360,495];
 let topY=70, bottomY=235;
 let parts=`
   <line x1="90" y1="${topY}" x2="565" y2="${topY}" stroke="#334155" stroke-width="4"/>
   <line x1="90" y1="${bottomY}" x2="565" y2="${bottomY}" stroke="#334155" stroke-width="4"/>
   <line x1="90" y1="${topY}" x2="90" y2="125" stroke="#334155" stroke-width="4"/>
   <line x1="90" y1="195" x2="90" y2="${bottomY}" stroke="#334155" stroke-width="4"/>
   <line x1="73" y1="145" x2="107" y2="145" stroke="#111" stroke-width="5"/>
   <line x1="79" y1="176" x2="101" y2="176" stroke="#111" stroke-width="3"/>
   <line x1="90" y1="125" x2="90" y2="145" stroke="#334155" stroke-width="4"/>
   <line x1="90" y1="176" x2="90" y2="195" stroke="#334155" stroke-width="4"/>
   <text x="55" y="142" class="legend">+</text>
   <text x="56" y="184" class="legend">−</text>
   <text x="118" y="164" class="legend">${fmtV(V)}</text>`;
 xs.forEach((x,i)=>{
   // vertical branch with a simple rectangular resistor body
   parts+=`
     <line x1="${x}" y1="${topY}" x2="${x}" y2="105" stroke="#334155" stroke-width="4"/>
     <rect x="${x-25}" y="105" width="50" height="92" rx="5" fill="#ead7a1" stroke="#7a6330" stroke-width="2"/>
     <line x1="${x}" y1="197" x2="${x}" y2="${bottomY}" stroke="#334155" stroke-width="4"/>
     <circle cx="${x}" cy="${topY}" r="5" fill="#334155"/>
     <circle cx="${x}" cy="${bottomY}" r="5" fill="#334155"/>
     <text x="${x+36}" y="132" font-weight="700">R${i+1}</text>
     <text x="${x+36}" y="153" class="legend">${fmtR(R[i])}</text>
     <text x="${x+36}" y="177" class="legend">I${i+1} = ${fmtI(vals[i].i)}</text>`;
 });
 parts+=`<text x="330" y="286" text-anchor="middle" font-size="16">Same voltage across every branch: ${fmtV(V)} • Total current: ${fmtI(It)}</text>`;
 $('diagram').innerHTML=parts;
}
update();
</script>
</body></html>
